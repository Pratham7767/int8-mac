<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 800" width="1060" height="800" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1060" height="800" fill="#ffffff"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a03232"/>
    </marker>
  </defs>

  <text x="530" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#111111">int8-mac microarchitecture</text>
  <text x="530" y="58" text-anchor="middle" font-size="13" fill="#555555">radix-4 Booth encoding, Wallace tree compression, configurable pipeline depth</text>

  <!-- ===== operands ===== -->
  <rect x="40" y="96" width="150" height="66" rx="5" fill="#f4f4f4" stroke="#666666" stroke-width="1.6"/>
  <text x="115" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">a, b</text>
  <text x="115" y="142" text-anchor="middle" font-size="11" fill="#666666">signed INT8</text>
  <text x="115" y="156" text-anchor="middle" font-size="11" fill="#666666">in_valid, acc_clear</text>

  <line x1="190" y1="129" x2="240" y2="129" stroke="#333333" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- ===== stage A: booth ===== -->
  <rect x="240" y="92" width="530" height="118" rx="6" fill="#eef2f8" stroke="#33455c" stroke-width="2"/>
  <text x="258" y="116" font-size="14" font-weight="bold" fill="#1b2a3a">radix-4 Booth encoder</text>
  <text x="258" y="134" font-size="11" fill="#666666">4 overlapping 3-bit windows of b, each selecting 0, ±a, ±2a</text>

  <g font-size="11" fill="#1b2a3a">
    <rect x="262" y="146" width="112" height="46" rx="4" fill="#ffffff" stroke="#33455c" stroke-width="1.4"/>
    <text x="318" y="164" text-anchor="middle">pp0 = sel &lt;&lt; 0</text>
    <text x="318" y="182" text-anchor="middle" font-size="10" fill="#777777">{b1,b0,0}</text>

    <rect x="386" y="146" width="112" height="46" rx="4" fill="#ffffff" stroke="#33455c" stroke-width="1.4"/>
    <text x="442" y="164" text-anchor="middle">pp1 = sel &lt;&lt; 2</text>
    <text x="442" y="182" text-anchor="middle" font-size="10" fill="#777777">{b3,b2,b1}</text>

    <rect x="510" y="146" width="112" height="46" rx="4" fill="#ffffff" stroke="#33455c" stroke-width="1.4"/>
    <text x="566" y="164" text-anchor="middle">pp2 = sel &lt;&lt; 4</text>
    <text x="566" y="182" text-anchor="middle" font-size="10" fill="#777777">{b5,b4,b3}</text>

    <rect x="634" y="146" width="112" height="46" rx="4" fill="#ffffff" stroke="#33455c" stroke-width="1.4"/>
    <text x="690" y="164" text-anchor="middle">pp3 = sel &lt;&lt; 6</text>
    <text x="690" y="182" text-anchor="middle" font-size="10" fill="#777777">{b7,b6,b5}</text>
  </g>

  <text x="800" y="140" font-size="11.5" fill="#1b2a3a">4 partial products</text>
  <text x="800" y="158" font-size="11" fill="#777777">instead of 8 for a plain</text>
  <text x="800" y="173" font-size="11" fill="#777777">array multiplier</text>

  <!-- pipeline register A -->
  <rect x="240" y="226" width="530" height="26" rx="3" fill="#dfe3ea" stroke="#777777" stroke-width="1.4"/>
  <text x="505" y="244" text-anchor="middle" font-size="11.5" fill="#444444">pipeline register — present when PIPE_STAGES ≥ 1</text>

  <line x1="505" y1="210" x2="505" y2="224" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="505" y1="252" x2="505" y2="272" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- ===== stage B: wallace ===== -->
  <rect x="240" y="274" width="530" height="150" rx="6" fill="#edf5ee" stroke="#2f6b3a" stroke-width="2"/>
  <text x="258" y="298" font-size="14" font-weight="bold" fill="#1d4527">Wallace tree</text>
  <text x="258" y="316" font-size="11" fill="#666666">carry-save compression: no carry propagation, depth independent of width</text>

  <rect x="290" y="330" width="200" height="40" rx="4" fill="#ffffff" stroke="#2f6b3a" stroke-width="1.5"/>
  <text x="390" y="349" text-anchor="middle" font-size="11.5" fill="#1d4527">CSA layer 1: pp0, pp1, pp2</text>
  <text x="390" y="363" text-anchor="middle" font-size="10" fill="#777777">4 rows → 3 rows</text>

  <rect x="520" y="330" width="200" height="40" rx="4" fill="#ffffff" stroke="#2f6b3a" stroke-width="1.5"/>
  <text x="620" y="349" text-anchor="middle" font-size="11.5" fill="#1d4527">CSA layer 2: s0, c0, pp3</text>
  <text x="620" y="363" text-anchor="middle" font-size="10" fill="#777777">3 rows → 2 rows</text>

  <line x1="490" y1="350" x2="518" y2="350" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="505" y="398" text-anchor="middle" font-size="11.5" fill="#1d4527">output: one sum vector + one carry vector</text>

  <!-- pipeline register B -->
  <rect x="240" y="440" width="530" height="26" rx="3" fill="#dfe3ea" stroke="#777777" stroke-width="1.4"/>
  <text x="505" y="458" text-anchor="middle" font-size="11.5" fill="#444444">pipeline register — present when PIPE_STAGES ≥ 2</text>

  <line x1="505" y1="424" x2="505" y2="438" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="505" y1="466" x2="505" y2="486" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- ===== stage C: CPA ===== -->
  <rect x="240" y="488" width="530" height="62" rx="6" fill="#fdf6ee" stroke="#b5651d" stroke-width="2"/>
  <text x="505" y="512" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a4512">carry-propagate adder</text>
  <text x="505" y="532" text-anchor="middle" font-size="11" fill="#7a4512">sum + carry → 16-bit product · the slowest single step in the datapath</text>

  <!-- pipeline register C -->
  <rect x="240" y="566" width="530" height="26" rx="3" fill="#dfe3ea" stroke="#777777" stroke-width="1.4"/>
  <text x="505" y="584" text-anchor="middle" font-size="11.5" fill="#444444">pipeline register — present when PIPE_STAGES = 3</text>

  <line x1="505" y1="550" x2="505" y2="564" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="505" y1="592" x2="505" y2="612" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- ===== accumulator ===== -->
  <rect x="240" y="614" width="530" height="70" rx="6" fill="#eef0f8" stroke="#3b3f7a" stroke-width="2"/>
  <text x="505" y="638" text-anchor="middle" font-size="14" font-weight="bold" fill="#272a58">accumulator  (32-bit)</text>
  <text x="505" y="658" text-anchor="middle" font-size="11" fill="#666666">acc ← acc + product, or acc ← product when acc_clear</text>
  <text x="505" y="675" text-anchor="middle" font-size="11" fill="#666666">product is registered here too, so it stays aligned with out_valid</text>

  <path d="M 770 649 L 830 649" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="838" y="644" font-size="12" fill="#333333">acc, product</text>
  <text x="838" y="660" font-size="12" fill="#333333">out_valid</text>

  <!-- accumulate feedback -->
  <path d="M 240 660 L 200 660 L 200 700 L 505 700 L 505 686" fill="none" stroke="#3b3f7a" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="330" y="716" font-size="11" fill="#3b3f7a">accumulate feedback</text>

  <!-- valid pipeline note -->
  <path d="M 190 150 L 170 150 L 170 649 L 238 649" fill="none" stroke="#a03232" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#aRed)"/>
  <text x="150" y="400" text-anchor="middle" font-size="11" fill="#a03232" transform="rotate(-90 150 400)">valid and acc_clear flow down beside the data</text>

  <!-- ===== tradeoff table ===== -->
  <line x1="40" y1="734" x2="1020" y2="734" stroke="#dddddd" stroke-width="1.4"/>
  <text x="40" y="756" font-size="12.5" font-weight="bold" fill="#111111">measured tradeoff (Yosys, technology-independent mapping)</text>

  <g font-size="11.5">
    <text x="40" y="778" font-weight="bold" fill="#333333">PIPE_STAGES</text>
    <text x="160" y="778" font-weight="bold" fill="#333333">latency</text>
    <text x="250" y="778" font-weight="bold" fill="#333333">cells</text>
    <text x="400" y="778" font-weight="bold" fill="#333333">registers</text>
    <text x="540" y="778" font-weight="bold" fill="#333333">logic levels</text>

    <text x="680" y="778" fill="#666666">deeper pipeline = shorter critical path</text>
  </g>
  <g font-size="11.5" fill="#444444">
    <text x="40" y="796">0 / 1 / 2 / 3</text>
    <text x="160" y="796">1 / 2 / 3 / 4</text>
    <text x="250" y="796">945 / 991 / 1021 / 1039</text>
    <text x="400" y="796">49 / 95 / 125 / 143</text>
    <text x="540" y="796">43 / 33 / 28 / 19</text>
    <text x="680" y="796" fill="#a03232">10% more area buys 2.3x shorter critical path</text>
  </g>
</svg>
